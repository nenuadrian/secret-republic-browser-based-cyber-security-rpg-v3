server {
    listen 80;
    server_name _;
    root /var/www/app/public_html;
    index index.php;
    autoindex off;
    server_tokens off;
    client_max_body_size 16m;

    # Block hidden files and anything outside the web root
    location ~ /\.(ht|git) {
        deny all;
    }

    location ^~ /includes/ {
        deny all;
    }

    # Serve static files directly, otherwise rewrite to index.php
    # (mirrors the Apache rule: RewriteRule ^(.*)$ index.php?/$1 [QSA,L])
    location / {
        try_files $uri $uri/ @rewrite;
    }

    location @rewrite {
        rewrite ^/(.*)$ /index.php?/$1 last;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        # Keep the port (e.g. localhost:8080): the game builds every link and
        # asset URL from HTTP_HOST. Set APP_URL to pin it behind a proxy.
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param REQUEST_SCHEME $scheme;
    }
}
